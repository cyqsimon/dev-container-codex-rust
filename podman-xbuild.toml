[profile]
name-template = "{{profile}}"

[profile.matrix]
profile = ["latest", "gpu-latest"]

[build.".+"]
image-name-template = "ghcr.io/cyqsimon/dev-container-codex-rust"
image-tag-template = "{{profile.name}}"
platforms = ["linux/amd64", "linux/arm64"]

# Unfortunately NVidia offers no official CUDA build for Fedora Aarch64
[build."gpu-latest"]
platforms = ["linux/amd64"]

[args."latest"]
ENV_VARIANT = "default"

[args."gpu-latest"]
ENV_VARIANT = "gpu"
